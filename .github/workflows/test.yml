name: API Tests

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify simbirsoft_sdet_project content
        run: |
          if [ -d "simbirsoft_sdet_project" ]; then
            echo "✅ Папка simbirsoft_sdet_project найдена"
            ls -la simbirsoft_sdet_project/
            if [ -f "simbirsoft_sdet_project/docker-compose.yaml" ]; then
              echo "✅ docker-compose.yaml найден"
            else
              echo "❌ docker-compose.yaml отсутствует!"
              exit 1
            fi
          else
            echo "❌ Папка simbirsoft_sdet_project не найдена!"
            ls -la
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Make gradlew executable
        run: |
          chmod +x gradlew

      - name: Stop any conflicting containers
        run: |
          if [ -f "simbirsoft_sdet_project/docker-compose.yaml" ]; then
            docker-compose -f simbirsoft_sdet_project/docker-compose.yaml down || true
          fi
          docker stop $(docker ps -aq) || true
          docker system prune -af || true

      - name: Start API Service
        run: |
          cd simbirsoft_sdet_project && docker-compose up --build -d

      - name: Wait for API to be ready
        run: |
          sleep 60

      - name: Check API health
        run: |
          curl -v http://localhost:8080/health || (echo "❌ API не отвечает" && exit 1)

      - name: Check PostgreSQL logs
        run: |
          docker-compose -f simbirsoft_sdet_project/docker-compose.yaml logs postgres

      - name: Check API logs
        run: |
          docker-compose -f simbirsoft_sdet_project/docker-compose.yaml logs service

      - name: Run Tests
        run: |
          ./gradlew test --info

      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: build/allure-results